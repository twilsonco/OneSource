[project]
name = "onesource"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.63.0",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pypdf>=6.14.2",
    "ruff>=0.15.20",
    "types-reportlab>=4.5.1.20260521",
]

[tool.mypy]
strict = true
# fontTools doesn't ship type stubs; we treat it as untyped.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

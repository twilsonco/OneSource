[project]
name = "onesource"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.63.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
]

[project.scripts]
generate = "vinyllabels.generate:main"
consolidate = "vinyllabels.consolidate.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinyllabels"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.2",
    "pypdf>=6.14.2",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-openpyxl>=3.1.5.20260827",
    "types-reportlab>=4.5.1.20260521",
]

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["vinyllabels"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "@overload",
    "assert_never",
    'if __name__ == "__main__":',
]

[tool.mypy]
strict = true
# The package lives under src/ and is installed editable by `uv sync`; naming
# the path here keeps `mypy .` working without relying on the editable finder.
mypy_path = "src"
# fontTools doesn't ship type stubs; we treat it as untyped.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

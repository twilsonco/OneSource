# Pre-commit hooks: ruff format, ruff lint, mypy type-check.
# Hooks shell out to `uv run` so they use the exact toolchain pinned in
# pyproject.toml / uv.lock. Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false
